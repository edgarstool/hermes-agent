schema_version: edgar.product.v0
capsule:
  id: server-doctor
  name: Server Doctor
  version: 0.1.0
  domain: infrastructure
  status: bounded_execution
  summary: "Diagnose EDGAR service health, explain incidents, and gate repair actions."
  actions:
    status:
      risk: low
      policy: ALLOW
      mode: read_only
    diagnose:
      risk: low
      policy: ALLOW
      mode: read_only
    repair:
      risk: high
      policy: OWNER_CONFIRM
      mode: mutate
  views:
    line:
      renderer: flex
      status: planned
    app:
      resource_uri: ui://server-doctor/status
      status: planned
  execution:
    runtime: hermes
    approval_engine: hermes
    delivery_ledger: hermes
    security_sink: terminal_guard
    task_ledger: reuse_before_build
  bindings:
    status:
      tool: server_doctor
      action: status
    diagnose:
      tool: server_doctor
      action: diagnose
    repair:
      tool: server_doctor
      action: repair
