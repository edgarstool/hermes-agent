# EDG2-63: branch-scoped independent proof for the Contabo-compatible approval slice.
# Public repository GitHub-hosted standard runner; no Blacksmith subscription,
# production LINE credentials, cloud host access or release publish.
name: EDGAR Contabo LINE Approval Proof
on:
  push:
    branches:
      - feat/edg2-63-contabo-live-compat-20261102

permissions:
  contents: read

concurrency:
  group: edgar-contabo-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-approval:
    name: Native signed LINE approval regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install repository pinned Python
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          extras: '["messaging"]'
          cache: 'false'
      - name: Run native LINE approval and gateway safety tests
        shell: bash
        env:
          HERMES_TELEMETRY: 'false'
        run: |
          set -euo pipefail
          test -n "${HERMES_PYTHON:-}"
          "$HERMES_PYTHON" -m pytest -q \
            tests/gateway/test_line_native_approval_binding.py \
            tests/gateway/test_approval_prompt_redaction.py \
            tests/gateway/test_approve_deny_commands.py
